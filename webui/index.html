<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Civision Gateway</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23624AFF'/%3E%3Cpath d='M16 5l9 5.2v11.6L16 27l-9-5.2V10.2z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- 主题/语言预置：避免首屏闪白或闪烁（零依赖内联脚本） -->
<script>
  (function () {
    try {
      var theme = localStorage.getItem('civision.theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      var lang = localStorage.getItem('civision.lang') || 'zh';
      document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
    } catch (e) { /* localStorage 不可用时保持默认深色 */ }
  })();
</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" href="#/studio" data-nav="studio">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3.5l10 5.7v13.6l-10 5.7-10-5.7V9.2z"/>
          <path d="M11 20.5l5-9 5 9" />
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">Civision Gateway</span>
        <span class="brand__sub" data-i18n="brand.sub">创作工作台 · 管理台</span>
      </span>
    </a>

    <nav class="nav-tabs" id="nav-tabs" aria-label="primary">
      <a class="nav-tab" href="#/studio" data-nav="studio" data-i18n="nav.studio">创作</a>
      <a class="nav-tab" href="#/admin" data-nav="admin" data-i18n="nav.admin">管理</a>
    </nav>

    <div class="header-right">
      <span class="key-chip" id="key-chip" title="">
        <svg class="icon icon--14" aria-hidden="true"><use href="#i-key"/></svg>
        <span class="key-chip__text">—</span>
      </span>
      <button class="icon-btn" id="theme-toggle" type="button" data-i18n-title="header.theme" title="切换主题">
        <svg class="icon" aria-hidden="true"><use href="#i-moon" id="theme-icon"/></svg>
      </button>
      <button class="lang-toggle" id="lang-toggle" type="button" title="中 / EN">
        <svg class="icon icon--14" aria-hidden="true"><use href="#i-globe"/></svg>
        <span class="lang-toggle__text">中</span>
      </button>
    </div>
  </div>
</header>

<div id="banner-slot" class="banner-slot"></div>

<main id="view" class="app-main" tabindex="-1"></main>

<footer class="app-footer">
  <span data-i18n="footer.note">前端零依赖 · 由同一个 FastAPI 进程托管 · 静态资源无需鉴权</span>
  <span class="app-footer__sep">·</span>
  <span id="build-tag" class="mono">webui</span>
</footer>

<div id="toast-stack" class="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="modal-root"></div>

<script type="module" src="app.js"></script>
</body>
</html>
